<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=Caveat:wght@400;500;600&family=Great+Vibes&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=Caveat:wght@400;500;600&family=Great+Vibes&display=swap" />
    </noscript>
    <title>SYORA — The Multiverse | One Woman. Infinite Versions.</title>
    <meta name="description" content="SYORA — The Multiverse. Premium Indian women's footwear across ICON, HERITAGE, EVERYDAY and MOTION. Different Worlds. Same You." />
    <meta name="theme-color" content="#1a0a0a" />
    <style>
      #initial-hero[hidden] { display: none !important; }
      #initial-hero {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-content: center;
        gap: 14px;
        overflow: hidden;
        color: #f5ece4;
        text-align: center;
        background:
          radial-gradient(ellipse at 50% 38%, rgba(153, 127, 91, 0.38), transparent 58%),
          linear-gradient(135deg, #484234 0%, #29251e 48%, #17130f 100%);
        pointer-events: none;
      }
      #initial-hero h1 {
        font: 300 clamp(5.5rem, 17vw, 13rem)/1 'Cormorant Garamond', Georgia, serif;
        letter-spacing: 0.55em;
        text-indent: 0.55em;
      }
      #initial-hero p {
        color: rgba(245, 236, 228, 0.6);
        font: italic 300 clamp(0.78rem, 1.8vw, 1.05rem)/1.4 'Cormorant Garamond', Georgia, serif;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
      }
      #initial-hero span {
        margin-top: 30px;
        color: rgba(245, 236, 228, 0.3);
        font: 500 0.52rem/1.4 Inter, Arial, sans-serif;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="initial-hero" aria-hidden="true" hidden>
      <h1>SYORA</h1>
      <p>One Woman. Infinite Versions.</p>
      <span>Scroll to explore</span>
    </div>
    <div id="root"></div>
    <script>
      if (window.location.pathname === '/') {
        document.getElementById('initial-hero').hidden = false;
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
